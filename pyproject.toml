[project]
name = "go2-record-and-replay"
version = "0.1.0"
description = "Record and replay teleoperation data for the Unitree Go2 in LeRobot v3.0 format"
requires-python = ">=3.12"
dependencies = [
    "go2-driver",
    "evdev",
    "lerobot",
    "numpy",
    "pyyaml",
    "pyatv",
]

[project.optional-dependencies]
viz = ["matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/go2_recorder"]

[[tool.uv.index]]
name = "jetson-cu130"
url = "https://pypi.jetson-ai-lab.io/sbsa/cu130/+simple/"

[tool.uv.sources]
go2-driver = { path = "../go2-driver", editable = true }
torch = { index = "jetson-cu130" }
torchaudio = { index = "jetson-cu130" }
torchvision = { index = "jetson-cu130" }
